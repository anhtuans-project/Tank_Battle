<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tank Battle</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18212b;}canvas{display:block;width:100%;height:100%;}</style></head><body><canvas id="game" aria-label="Tank Battle game area"></canvas><script>const a = document.getElementById('game');const b = a.getContext('2d');const C = Object.freeze({ MENU: 0, SETTINGS: 1, HELP: 2, PLAYING: 3, GAME_OVER: 4, WIN: 5 });let D = C.MENU;const e = {};const f = [];const g = [];const h = [];let i = 0;let j = 0;let q = 1;let K = 0;const S = { difficulty: 'NORMAL', sound: true };const M = [['111111111111','100000000001','101110111101','100010000001','101010111101','100000100001','101111101101','100000000001','111111111111'], ['111111111111','100010000001','101010111101','100000100001','101110111101','100010000001','101011101101','100000000001','111111111111']];let map = M[0];const m = {x: 0,y: 0,angle: -Math.PI / 2,speed: 180,hp: 100,cooldown: 0,size: 28};const R = { x: 0, y: 0, width: 190, height: 44 };const N = { play: 0, S: 0, help: 0, back: 0 };let O = 0;function resizeCanvas() {a.width = window.innerWidth;a.height = window.innerHeight;const size = tileSize();m.x = m.x || mapPoint(1, 1).x;m.y = m.y || mapPoint(1, 1).y;m.x = Math.max(size + m.size / 2, Math.min(m.x, a.width - size - m.size / 2));m.y = Math.max(size + m.size / 2, Math.min(m.y, a.height - size - m.size / 2));}function tileSize() {return Math.min(a.width / map[0].length, a.height / map.length);}function mapOrigin() {const size = tileSize();return { x: (a.width - size * map[0].length) / 2, y: (a.height - size * map.length) / 2 };}function mapPoint(column, row) {const size = tileSize();const origin = mapOrigin();return { x: origin.x + (column + .5) * size, y: origin.y + (row + .5) * size };}function wallBounds(column, row) {const size = tileSize();const origin = mapOrigin();return { x: origin.x + column * size, y: origin.y + row * size, width: size, height: size };}function hitsWall(x, y, radius) {for (let row = 0; row < map.length; row++) for (let column = 0; column < map[row].length; column++) {if (map[row][column] === '1') {const bounds = wallBounds(column, row);const closestX = Math.max(bounds.x, Math.min(x, bounds.x + bounds.width));const closestY = Math.max(bounds.y, Math.min(y, bounds.y + bounds.height));if (Math.hypot(x - closestX, y - closestY) < radius) return true;}}return false;}function moveTank(tank, x, y) {if (!hitsWall(x, y, tank.size * .8)) {tank.x = x;tank.y = y;}}function createBullet(x, y, angle, owner) {const bulletSpeed = 520;const muzzleX = x + Math.cos(angle) * 30;const muzzleY = y + Math.sin(angle) * 30;f.push({x: muzzleX,y: muzzleY,vx: Math.cos(angle) * bulletSpeed,vy: Math.sin(angle) * bulletSpeed,owner,radius: 5});h.push({ type: 'flash', x: muzzleX, y: muzzleY, life: .08 });}function createExplosion(x, y) {for (let index = 0; index < 8; index++) {const angle = index * Math.PI / 4;h.push({ type: 'spark', x, y, vx: Math.cos(angle) * 70, vy: Math.sin(angle) * 70, life: .35 });}}function spawnEnemy() {let point;do {const row = 1 + Math.floor(Math.random() * (map.length - 2));const column = 1 + Math.floor(Math.random() * (map[0].length - 2));point = map[row][column] === '0' ? mapPoint(column, row) : null;} while (!point || Math.hypot(point.x - m.x, point.y - m.y) < 180 || hitsWall(point.x, point.y, 24));g.push({x: point.x,y: point.y,angle: 0,speed: (65 + j * 8) * difficultyScale(),hp: Math.max(1, Math.ceil((1 + j / 2) * difficultyScale())),cooldown: 1.7 - difficultyScale() * .35 + Math.random() * .8,size: 24});}function difficultyScale() {return S.difficulty === 'EASY' ? .8 : S.difficulty === 'HARD' ? 1.25 : 1;}function startWave() {j++;const count = 1 + j * 2;for (let index = 0; index < count; index++) spawnEnemy();}function loadLevel(nextLevel) {q = nextLevel;map = M[q - 1];f.length = 0;g.length = 0;h.length = 0;j = 0;const point = mapPoint(1, 1);m.x = point.x;m.y = point.y;m.angle = -Math.PI / 2;startWave();}function restartGame() {f.length = 0;g.length = 0;h.length = 0;i = 0;q = 1;j = 0;K = 0;D = C.PLAYING;map = M[0];m.hp = 100;m.cooldown = 0;m.angle = -Math.PI / 2;const point = mapPoint(1, 1);m.x = point.x;m.y = point.y;startWave();}function startGame() {restartGame();}function update(deltaTime) {K = Math.max(0, K - deltaTime);for (let index = h.length - 1; index >= 0; index--) {const effect = h[index];effect.life -= deltaTime;if (effect.type === 'spark') {effect.x += effect.vx * deltaTime;effect.y += effect.vy * deltaTime;}if (effect.life <= 0) h.splice(index, 1);}if (D !== C.PLAYING) return;const forward = (e.w || e.ArrowUp ? 1 : 0) - (e.s || e.ArrowDown ? 1 : 0);const turn = (e.d || e.ArrowRight ? 1 : 0) - (e.a || e.ArrowLeft ? 1 : 0);m.angle += turn * 3 * deltaTime;moveTank(m, m.x + Math.cos(m.angle) * forward * m.speed * deltaTime, m.y);moveTank(m, m.x, m.y + Math.sin(m.angle) * forward * m.speed * deltaTime);m.x = Math.max(m.size, Math.min(m.x, a.width - m.size));m.y = Math.max(m.size, Math.min(m.y, a.height - m.size));m.cooldown = Math.max(0, m.cooldown - deltaTime);g.forEach(enemy => {const dx = m.x - enemy.x;const dy = m.y - enemy.y;const distance = Math.hypot(dx, dy);enemy.angle = Math.atan2(dy, dx);if (distance > 150) {moveTank(enemy, enemy.x + Math.cos(enemy.angle) * enemy.speed * deltaTime, enemy.y);moveTank(enemy, enemy.x, enemy.y + Math.sin(enemy.angle) * enemy.speed * deltaTime);}enemy.x = Math.max(enemy.size, Math.min(enemy.x, a.width - enemy.size));enemy.y = Math.max(enemy.size, Math.min(enemy.y, a.height - enemy.size));enemy.cooldown -= deltaTime;if (enemy.cooldown <= 0 && distance < 650) {createBullet(enemy.x, enemy.y, enemy.angle, 'enemy');enemy.cooldown = 1.5 + Math.random();}});for (let index = f.length - 1; index >= 0; index--) {const bullet = f[index];bullet.x += bullet.vx * deltaTime;bullet.y += bullet.vy * deltaTime;if (bullet.x < -bullet.radius || bullet.x > a.width + bullet.radius || bullet.y < -bullet.radius || bullet.y > a.height + bullet.radius || hitsWall(bullet.x, bullet.y, bullet.radius)) {f.splice(index, 1);continue;}if (bullet.owner === 'player') {const enemy = g.find(enemy => Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < bullet.radius + enemy.size);if (enemy) {enemy.hp--;f.splice(index, 1);if (enemy.hp <= 0) {g.splice(g.indexOf(enemy), 1);createExplosion(enemy.x, enemy.y);i += 10;}}} else if (Math.hypot(bullet.x - m.x, bullet.y - m.y) < bullet.radius + m.size) {m.hp -= 10;K = .2;f.splice(index, 1);if (m.hp <= 0) D = C.GAME_OVER;}}if (!g.length) {if (q < M.length) loadLevel(q + 1);else D = C.WIN;}}function shoot() {if (D !== C.PLAYING || m.cooldown > 0) return;createBullet(m.x, m.y, m.angle, 'player');m.cooldown = .25;}function drawPlayer() {b.save();b.translate(m.x, m.y);b.rotate(m.angle);b.fillStyle = '#4caf50';b.fillRect(-m.size, -m.size * .7, m.size * 2, m.size * 1.4);b.fillStyle = '#8bc34a';b.fillRect(-10, -7, 30, 14);b.fillStyle = '#263238';b.fillRect(0, -4, 25, 8);b.restore();}function drawEnemies() {g.forEach(enemy => {b.save();b.translate(enemy.x, enemy.y);b.rotate(enemy.angle);b.fillStyle = '#d94f4f';b.fillRect(-enemy.size, -enemy.size * .7, enemy.size * 2, enemy.size * 1.4);b.fillStyle = '#ff7b54';b.fillRect(-9, -7, 28, 14);b.fillStyle = '#3b2020';b.fillRect(0, -4, 25, 8);b.restore();b.fillStyle = '#f5f5f5';b.font = '12px sans-serif';b.textAlign = 'center';b.fillText(`HP ${enemy.hp}`, enemy.x, enemy.y - enemy.size - 8);});}function drawBullets() {b.fillStyle = '#ffca28';f.forEach(bullet => {b.beginPath();b.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);b.fill();});}function drawEffects() {h.forEach(effect => {b.globalAlpha = Math.min(1, effect.life * 8);b.fillStyle = effect.type === 'flash' ? '#fff59d' : '#ff7043';b.beginPath();b.arc(effect.x, effect.y, effect.type === 'flash' ? 10 : 5, 0, Math.PI * 2);b.fill();});b.globalAlpha = 1;}function drawWalls() {b.fillStyle = '#607d8b';for (let row = 0; row < map.length; row++) for (let column = 0; column < map[row].length; column++) {if (map[row][column] === '1') {const bounds = wallBounds(column, row);b.fillRect(bounds.x, bounds.y, bounds.width, bounds.height);}}}function drawStatus() {b.fillStyle = 'rgba(15, 23, 30, .86)';b.fillRect(12, 12, 180, 104);b.fillStyle = '#f5f5f5';b.font = 'bold 14px sans-serif';b.textAlign = 'left';b.fillText(`SCORE  ${i}`, 24, 34);b.fillText(`LEVEL  ${q}`, 24, 56);b.fillText(`WAVE   ${j}`, 24, 78);b.fillText(`HP     ${Math.max(0, m.hp)}`, 24, 100);b.fillStyle = '#263238';b.fillRect(76, 90, 96, 10);b.fillStyle = m.hp > 30 ? '#66bb6a' : '#ef5350';b.fillRect(76, 90, 96 * Math.max(0, m.hp) / 100, 10);}function drawGameOver() {if (D !== C.GAME_OVER && D !== C.WIN) return;b.fillStyle = 'rgba(0, 0, 0, .7)';b.fillRect(0, 0, a.width, a.height);b.fillStyle = '#ffffff';b.textAlign = 'center';b.font = 'bold 36px sans-serif';b.fillText(D === C.WIN ? 'YOU WIN' : 'GAME OVER', a.width / 2, a.height / 2 - 20);R.x = a.width / 2 - R.width / 2;R.y = a.height / 2 + 12;b.fillStyle = '#4caf50';b.fillRect(R.x, R.y, R.width, R.height);b.fillStyle = '#ffffff';b.font = 'bold 18px sans-serif';b.fillText(D === C.WIN ? 'PLAY AGAIN' : 'RESTART', a.width / 2, R.y + 28);}function drawButton(label, y, color = '#4caf50') {const width = 210;const height = 44;const x = a.width / 2 - width / 2;b.fillStyle = color;b.fillRect(x, y, width, height);b.fillStyle = '#ffffff';b.font = 'bold 16px sans-serif';b.textAlign = 'center';b.fillText(label, a.width / 2, y + 28);return { x, y, width, height };}function drawMenu() {b.fillStyle = '#18212b';b.fillRect(0, 0, a.width, a.height);b.fillStyle = '#8bc34a';b.font = 'bold 42px sans-serif';b.textAlign = 'center';b.fillText('TANK BATTLE', a.width / 2, a.height / 2 - 130);N.play = drawButton('PLAY', a.height / 2 - 70);N.S = drawButton('SETTINGS', a.height / 2 - 16, '#607d8b');N.help = drawButton('HOW TO PLAY', a.height / 2 + 38, '#607d8b');}function drawSettings() {b.fillStyle = '#18212b';b.fillRect(0, 0, a.width, a.height);b.fillStyle = '#ffffff';b.font = 'bold 30px sans-serif';b.textAlign = 'center';b.fillText('SETTINGS', a.width / 2, a.height / 2 - 120);b.font = '18px sans-serif';b.fillText(`DIFFICULTY: ${S.difficulty}`, a.width / 2, a.height / 2 - 62);N.S = drawButton('CHANGE DIFFICULTY', a.height / 2 - 38, '#607d8b');b.fillText(`SOUND: ${S.sound ? 'ON' : 'OFF'}`, a.width / 2, a.height / 2 + 32);N.play = drawButton('TOGGLE SOUND', a.height / 2 + 54, '#607d8b');N.back = drawButton('BACK', a.height / 2 + 108, '#455a64');}function drawHelp() {b.fillStyle = '#18212b';b.fillRect(0, 0, a.width, a.height);b.fillStyle = '#ffffff';b.textAlign = 'center';b.font = 'bold 30px sans-serif';b.fillText('HOW TO PLAY', a.width / 2, a.height / 2 - 110);b.font = '17px sans-serif';b.fillText('WASD / ARROWS  MOVE AND TURN', a.width / 2, a.height / 2 - 48);b.fillText('MOUSE  AIM    CLICK  FIRE', a.width / 2, a.height / 2 - 14);b.fillText('DESTROY ENEMIES AND SURVIVE', a.width / 2, a.height / 2 + 20);N.back = drawButton('BACK', a.height / 2 + 64, '#455a64');}function render() {if (D === C.MENU) return drawMenu();if (D === C.SETTINGS) return drawSettings();if (D === C.HELP) return drawHelp();b.fillStyle = '#18212b';b.fillRect(0, 0, a.width, a.height);drawWalls();drawBullets();drawEnemies();drawPlayer();drawEffects();drawStatus();drawGameOver();if (K) {b.fillStyle = `rgba(239, 83, 80, ${K * 1.5})`;b.fillRect(0, 0, a.width, a.height);}}function gameLoop(time) {const deltaTime = Math.min((time - O) / 1000, .05);O = time;update(deltaTime);render();requestAnimationFrame(gameLoop);}window.addEventListener('keydown', event => {e[event.key.length === 1 ? event.key.toLowerCase() : event.key] = true;if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();});window.addEventListener('keyup', event => {e[event.key.length === 1 ? event.key.toLowerCase() : event.key] = false;});a.addEventListener('mousemove', event => {const bounds = a.getBoundingClientRect();m.angle = Math.atan2(event.clientY - bounds.top - m.y, event.clientX - bounds.left - m.x);});a.addEventListener('click', event => {const bounds = a.getBoundingClientRect();const x = event.clientX - bounds.left;const y = event.clientY - bounds.top;const inside = button => x >= button.x && x <= button.x + button.width && y >= button.y && y <= button.y + button.height;if (D === C.MENU) {if (inside(N.play)) startGame();else if (inside(N.S)) D = C.SETTINGS;else if (inside(N.help)) D = C.HELP;} else if (D === C.SETTINGS) {if (inside(N.S)) S.difficulty = S.difficulty === 'EASY' ? 'NORMAL' : S.difficulty === 'NORMAL' ? 'HARD' : 'EASY';else if (inside(N.play)) S.sound = !S.sound;else if (inside(N.back)) D = C.MENU;} else if (D === C.HELP) {if (inside(N.back)) D = C.MENU;} else if (D === C.GAME_OVER || D === C.WIN) {if (inside(R)) restartGame();} else shoot();});window.addEventListener('resize', resizeCanvas);resizeCanvas();requestAnimationFrame(gameLoop);</script></body></html>
