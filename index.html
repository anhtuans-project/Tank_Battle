<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tank Battle</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #18212b;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Tank Battle game area"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const context = canvas.getContext('2d');
    const GAME_STATE = Object.freeze({ PLAYING: 0, GAME_OVER: 1 });
    let gameState = GAME_STATE.PLAYING;
    const keys = {};
    const mouse = { x: 0, y: 0 };
    const bullets = [];
    const enemies = [];
    let score = 0;
    let wave = 0;
    const map = [
      '111111111111',
      '100000000001',
      '101110111101',
      '100010000001',
      '101010111101',
      '100000100001',
      '101111101101',
      '100000000001',
      '111111111111'
    ];
    const player = {
      x: 0,
      y: 0,
      angle: -Math.PI / 2,
      speed: 180,
      hp: 100,
      cooldown: 0,
      size: 28
    };
    const restartButton = { x: 0, y: 0, width: 190, height: 44 };
    let previousTime = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const size = tileSize();
      player.x = player.x || mapPoint(1, 1).x;
      player.y = player.y || mapPoint(1, 1).y;
      player.x = Math.max(size + player.size / 2, Math.min(player.x, canvas.width - size - player.size / 2));
      player.y = Math.max(size + player.size / 2, Math.min(player.y, canvas.height - size - player.size / 2));
    }

    function tileSize() {
      return Math.min(canvas.width / map[0].length, canvas.height / map.length);
    }

    function mapOrigin() {
      const size = tileSize();
      return { x: (canvas.width - size * map[0].length) / 2, y: (canvas.height - size * map.length) / 2 };
    }

    function mapPoint(column, row) {
      const size = tileSize();
      const origin = mapOrigin();
      return { x: origin.x + (column + .5) * size, y: origin.y + (row + .5) * size };
    }

    function wallBounds(wall) {
      const size = tileSize();
      const origin = mapOrigin();
      return { x: origin.x + wall.column * size, y: origin.y + wall.row * size, width: size, height: size };
    }

    function hitsWall(x, y, radius) {
      return map.some((row, rowIndex) => [...row].some((cell, column) => {
        if (cell !== '1') return false;
        const bounds = wallBounds({ column, row: rowIndex });
        const closestX = Math.max(bounds.x, Math.min(x, bounds.x + bounds.width));
        const closestY = Math.max(bounds.y, Math.min(y, bounds.y + bounds.height));
        return Math.hypot(x - closestX, y - closestY) < radius;
      }));
    }

    function moveTank(tank, x, y) {
      if (!hitsWall(x, y, tank.size * .8)) {
        tank.x = x;
        tank.y = y;
      }
    }

    function createBullet(x, y, angle, owner) {
      const bulletSpeed = 520;
      bullets.push({
        x: x + Math.cos(angle) * 30,
        y: y + Math.sin(angle) * 30,
        vx: Math.cos(angle) * bulletSpeed,
        vy: Math.sin(angle) * bulletSpeed,
        owner,
        radius: 5
      });
    }

    function spawnEnemy() {
      let point;
      do {
        const row = 1 + Math.floor(Math.random() * (map.length - 2));
        const column = 1 + Math.floor(Math.random() * (map[0].length - 2));
        point = map[row][column] === '0' ? mapPoint(column, row) : null;
      } while (!point || Math.hypot(point.x - player.x, point.y - player.y) < 180 || hitsWall(point.x, point.y, 24));
      enemies.push({
        x: point.x,
        y: point.y,
        angle: 0,
        speed: 65 + wave * 8,
        hp: 1 + Math.ceil(wave / 2),
        cooldown: .7 + Math.random() * .8,
        size: 24
      });
    }

    function startWave() {
      wave++;
      const count = 1 + wave * 2;
      for (let index = 0; index < count; index++) spawnEnemy();
    }

    function restartGame() {
      bullets.length = 0;
      enemies.length = 0;
      score = 0;
      wave = 0;
      gameState = GAME_STATE.PLAYING;
      player.hp = 100;
      player.cooldown = 0;
      player.angle = -Math.PI / 2;
      const point = mapPoint(1, 1);
      player.x = point.x;
      player.y = point.y;
      startWave();
    }

    function update(deltaTime) {
      if (gameState === GAME_STATE.GAME_OVER) return;
      const forward = (keys.w || keys.ArrowUp ? 1 : 0) - (keys.s || keys.ArrowDown ? 1 : 0);
      const turn = (keys.d || keys.ArrowRight ? 1 : 0) - (keys.a || keys.ArrowLeft ? 1 : 0);
      player.angle += turn * 3 * deltaTime;
      moveTank(player, player.x + Math.cos(player.angle) * forward * player.speed * deltaTime, player.y);
      moveTank(player, player.x, player.y + Math.sin(player.angle) * forward * player.speed * deltaTime);
      player.x = Math.max(player.size, Math.min(player.x, canvas.width - player.size));
      player.y = Math.max(player.size, Math.min(player.y, canvas.height - player.size));
      player.cooldown = Math.max(0, player.cooldown - deltaTime);
      enemies.forEach(enemy => {
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const distance = Math.hypot(dx, dy);
        enemy.angle = Math.atan2(dy, dx);
        if (distance > 150) {
          moveTank(enemy, enemy.x + Math.cos(enemy.angle) * enemy.speed * deltaTime, enemy.y);
          moveTank(enemy, enemy.x, enemy.y + Math.sin(enemy.angle) * enemy.speed * deltaTime);
        }
        enemy.x = Math.max(enemy.size, Math.min(enemy.x, canvas.width - enemy.size));
        enemy.y = Math.max(enemy.size, Math.min(enemy.y, canvas.height - enemy.size));
        enemy.cooldown -= deltaTime;
        if (enemy.cooldown <= 0 && distance < 650) {
          createBullet(enemy.x, enemy.y, enemy.angle, 'enemy');
          enemy.cooldown = 1.5 + Math.random();
        }
      });
      for (let index = bullets.length - 1; index >= 0; index--) {
        const bullet = bullets[index];
        bullet.x += bullet.vx * deltaTime;
        bullet.y += bullet.vy * deltaTime;
        if (bullet.x < -bullet.radius || bullet.x > canvas.width + bullet.radius || bullet.y < -bullet.radius || bullet.y > canvas.height + bullet.radius || hitsWall(bullet.x, bullet.y, bullet.radius)) {
          bullets.splice(index, 1);
          continue;
        }
        if (bullet.owner === 'player') {
          const enemy = enemies.find(enemy => Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < bullet.radius + enemy.size);
          if (enemy) {
            enemy.hp--;
            bullets.splice(index, 1);
            if (enemy.hp <= 0) {
              enemies.splice(enemies.indexOf(enemy), 1);
              score += 10;
            }
          }
        } else if (Math.hypot(bullet.x - player.x, bullet.y - player.y) < bullet.radius + player.size) {
          player.hp -= 10;
          bullets.splice(index, 1);
          if (player.hp <= 0) gameState = GAME_STATE.GAME_OVER;
        }
      }
      if (!enemies.length) startWave();
    }

    function shoot() {
      if (gameState !== GAME_STATE.PLAYING || player.cooldown > 0) return;
      createBullet(player.x, player.y, player.angle, 'player');
      player.cooldown = .25;
    }

    function drawPlayer() {
      context.save();
      context.translate(player.x, player.y);
      context.rotate(player.angle);
      context.fillStyle = '#4caf50';
      context.fillRect(-player.size, -player.size * .7, player.size * 2, player.size * 1.4);
      context.fillStyle = '#8bc34a';
      context.fillRect(-10, -7, 30, 14);
      context.fillStyle = '#263238';
      context.fillRect(0, -4, 25, 8);
      context.restore();
    }

    function drawEnemies() {
      enemies.forEach(enemy => {
        context.save();
        context.translate(enemy.x, enemy.y);
        context.rotate(enemy.angle);
        context.fillStyle = '#d94f4f';
        context.fillRect(-enemy.size, -enemy.size * .7, enemy.size * 2, enemy.size * 1.4);
        context.fillStyle = '#ff7b54';
        context.fillRect(-9, -7, 28, 14);
        context.fillStyle = '#3b2020';
        context.fillRect(0, -4, 25, 8);
        context.restore();
        context.fillStyle = '#f5f5f5';
        context.font = '12px sans-serif';
        context.textAlign = 'center';
        context.fillText(`HP ${enemy.hp}`, enemy.x, enemy.y - enemy.size - 8);
      });
    }

    function drawBullets() {
      context.fillStyle = '#ffca28';
      bullets.forEach(bullet => {
        context.beginPath();
        context.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        context.fill();
      });
    }

    function drawWalls() {
      context.fillStyle = '#607d8b';
      map.forEach((row, rowIndex) => [...row].forEach((cell, column) => {
        if (cell === '1') {
          const bounds = wallBounds({ column, row: rowIndex });
          context.fillRect(bounds.x, bounds.y, bounds.width, bounds.height);
        }
      }));
    }

    function drawStatus() {
      context.fillStyle = 'rgba(15, 23, 30, .86)';
      context.fillRect(12, 12, 180, 82);
      context.fillStyle = '#f5f5f5';
      context.font = 'bold 14px sans-serif';
      context.textAlign = 'left';
      context.fillText(`SCORE  ${score}`, 24, 34);
      context.fillText(`WAVE   ${wave}`, 24, 56);
      context.fillText(`HP     ${Math.max(0, player.hp)}`, 24, 78);
      context.fillStyle = '#263238';
      context.fillRect(76, 68, 96, 10);
      context.fillStyle = player.hp > 30 ? '#66bb6a' : '#ef5350';
      context.fillRect(76, 68, 96 * Math.max(0, player.hp) / 100, 10);
    }

    function drawGameOver() {
      if (gameState !== GAME_STATE.GAME_OVER) return;
      context.fillStyle = 'rgba(0, 0, 0, .7)';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#ffffff';
      context.textAlign = 'center';
      context.font = 'bold 36px sans-serif';
      context.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
      restartButton.x = canvas.width / 2 - restartButton.width / 2;
      restartButton.y = canvas.height / 2 + 12;
      context.fillStyle = '#4caf50';
      context.fillRect(restartButton.x, restartButton.y, restartButton.width, restartButton.height);
      context.fillStyle = '#ffffff';
      context.font = 'bold 18px sans-serif';
      context.fillText('RESTART', canvas.width / 2, restartButton.y + 28);
    }

    function render() {
      context.fillStyle = '#18212b';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawWalls();
      drawBullets();
      drawEnemies();
      drawPlayer();
      drawStatus();
      drawGameOver();
    }

    function gameLoop(time) {
      const deltaTime = Math.min((time - previousTime) / 1000, .05);
      previousTime = time;
      update(deltaTime);
      render();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', event => {
      keys[event.key.length === 1 ? event.key.toLowerCase() : event.key] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
    });
    window.addEventListener('keyup', event => {
      keys[event.key.length === 1 ? event.key.toLowerCase() : event.key] = false;
    });
    canvas.addEventListener('mousemove', event => {
      const bounds = canvas.getBoundingClientRect();
      mouse.x = event.clientX - bounds.left;
      mouse.y = event.clientY - bounds.top;
      player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    });
    canvas.addEventListener('click', event => {
      if (gameState === GAME_STATE.GAME_OVER) {
        const bounds = canvas.getBoundingClientRect();
        const x = event.clientX - bounds.left;
        const y = event.clientY - bounds.top;
        if (x >= restartButton.x && x <= restartButton.x + restartButton.width && y >= restartButton.y && y <= restartButton.y + restartButton.height) restartGame();
      } else shoot();
    });
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    startWave();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
