<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tank Battle</title><style>html, body {margin: 0;width: 100%;height: 100%;overflow: hidden;background: #18212b;}canvas {display: block;width: 100%;height: 100%;}</style></head><body><canvas id="game" aria-label="Tank Battle game area"></canvas><script>const canvas = document.getElementById('game');const context = canvas.getContext('2d');const GAME_STATE = Object.freeze({ MENU: 0, SETTINGS: 1, HELP: 2, PLAYING: 3, GAME_OVER: 4, WIN: 5 });let gameState = GAME_STATE.MENU;const keys = {};const bullets = [];const enemies = [];const effects = [];let score = 0;let wave = 0;let level = 1;let damageFlash = 0;const settings = { difficulty: 'NORMAL', sound: true };const maps = [['111111111111','100000000001','101110111101','100010000001','101010111101','100000100001','101111101101','100000000001','111111111111'], ['111111111111','100010000001','101010111101','100000100001','101110111101','100010000001','101011101101','100000000001','111111111111']];let map = maps[0];const player = {x: 0,y: 0,angle: -Math.PI / 2,speed: 180,hp: 100,cooldown: 0,size: 28};const restartButton = { x: 0, y: 0, width: 190, height: 44 };const menuButtons = { play: 0, settings: 0, help: 0, back: 0 };let previousTime = 0;function resizeCanvas() {canvas.width = window.innerWidth;canvas.height = window.innerHeight;const size = tileSize();player.x = player.x || mapPoint(1, 1).x;player.y = player.y || mapPoint(1, 1).y;player.x = Math.max(size + player.size / 2, Math.min(player.x, canvas.width - size - player.size / 2));player.y = Math.max(size + player.size / 2, Math.min(player.y, canvas.height - size - player.size / 2));}function tileSize() {return Math.min(canvas.width / map[0].length, canvas.height / map.length);}function mapOrigin() {const size = tileSize();return { x: (canvas.width - size * map[0].length) / 2, y: (canvas.height - size * map.length) / 2 };}function mapPoint(column, row) {const size = tileSize();const origin = mapOrigin();return { x: origin.x + (column + .5) * size, y: origin.y + (row + .5) * size };}function wallBounds(column, row) {const size = tileSize();const origin = mapOrigin();return { x: origin.x + column * size, y: origin.y + row * size, width: size, height: size };}function hitsWall(x, y, radius) {for (let row = 0; row < map.length; row++) for (let column = 0; column < map[row].length; column++) {if (map[row][column] === '1') {const bounds = wallBounds(column, row);const closestX = Math.max(bounds.x, Math.min(x, bounds.x + bounds.width));const closestY = Math.max(bounds.y, Math.min(y, bounds.y + bounds.height));if (Math.hypot(x - closestX, y - closestY) < radius) return true;}}return false;}function moveTank(tank, x, y) {if (!hitsWall(x, y, tank.size * .8)) {tank.x = x;tank.y = y;}}function createBullet(x, y, angle, owner) {const bulletSpeed = 520;const muzzleX = x + Math.cos(angle) * 30;const muzzleY = y + Math.sin(angle) * 30;bullets.push({x: muzzleX,y: muzzleY,vx: Math.cos(angle) * bulletSpeed,vy: Math.sin(angle) * bulletSpeed,owner,radius: 5});effects.push({ type: 'flash', x: muzzleX, y: muzzleY, life: .08 });}function createExplosion(x, y) {for (let index = 0; index < 8; index++) {const angle = index * Math.PI / 4;effects.push({ type: 'spark', x, y, vx: Math.cos(angle) * 70, vy: Math.sin(angle) * 70, life: .35 });}}function spawnEnemy() {let point;do {const row = 1 + Math.floor(Math.random() * (map.length - 2));const column = 1 + Math.floor(Math.random() * (map[0].length - 2));point = map[row][column] === '0' ? mapPoint(column, row) : null;} while (!point || Math.hypot(point.x - player.x, point.y - player.y) < 180 || hitsWall(point.x, point.y, 24));enemies.push({x: point.x,y: point.y,angle: 0,speed: (65 + wave * 8) * difficultyScale(),hp: Math.max(1, Math.ceil((1 + wave / 2) * difficultyScale())),cooldown: 1.7 - difficultyScale() * .35 + Math.random() * .8,size: 24});}function difficultyScale() {return settings.difficulty === 'EASY' ? .8 : settings.difficulty === 'HARD' ? 1.25 : 1;}function startWave() {wave++;const count = 1 + wave * 2;for (let index = 0; index < count; index++) spawnEnemy();}function loadLevel(nextLevel) {level = nextLevel;map = maps[level - 1];bullets.length = 0;enemies.length = 0;effects.length = 0;wave = 0;const point = mapPoint(1, 1);player.x = point.x;player.y = point.y;player.angle = -Math.PI / 2;startWave();}function restartGame() {bullets.length = 0;enemies.length = 0;effects.length = 0;score = 0;level = 1;wave = 0;damageFlash = 0;gameState = GAME_STATE.PLAYING;map = maps[0];player.hp = 100;player.cooldown = 0;player.angle = -Math.PI / 2;const point = mapPoint(1, 1);player.x = point.x;player.y = point.y;startWave();}function startGame() {restartGame();}function update(deltaTime) {damageFlash = Math.max(0, damageFlash - deltaTime);for (let index = effects.length - 1; index >= 0; index--) {const effect = effects[index];effect.life -= deltaTime;if (effect.type === 'spark') {effect.x += effect.vx * deltaTime;effect.y += effect.vy * deltaTime;}if (effect.life <= 0) effects.splice(index, 1);}if (gameState !== GAME_STATE.PLAYING) return;const forward = (keys.w || keys.ArrowUp ? 1 : 0) - (keys.s || keys.ArrowDown ? 1 : 0);const turn = (keys.d || keys.ArrowRight ? 1 : 0) - (keys.a || keys.ArrowLeft ? 1 : 0);player.angle += turn * 3 * deltaTime;moveTank(player, player.x + Math.cos(player.angle) * forward * player.speed * deltaTime, player.y);moveTank(player, player.x, player.y + Math.sin(player.angle) * forward * player.speed * deltaTime);player.x = Math.max(player.size, Math.min(player.x, canvas.width - player.size));player.y = Math.max(player.size, Math.min(player.y, canvas.height - player.size));player.cooldown = Math.max(0, player.cooldown - deltaTime);enemies.forEach(enemy => {const dx = player.x - enemy.x;const dy = player.y - enemy.y;const distance = Math.hypot(dx, dy);enemy.angle = Math.atan2(dy, dx);if (distance > 150) {moveTank(enemy, enemy.x + Math.cos(enemy.angle) * enemy.speed * deltaTime, enemy.y);moveTank(enemy, enemy.x, enemy.y + Math.sin(enemy.angle) * enemy.speed * deltaTime);}enemy.x = Math.max(enemy.size, Math.min(enemy.x, canvas.width - enemy.size));enemy.y = Math.max(enemy.size, Math.min(enemy.y, canvas.height - enemy.size));enemy.cooldown -= deltaTime;if (enemy.cooldown <= 0 && distance < 650) {createBullet(enemy.x, enemy.y, enemy.angle, 'enemy');enemy.cooldown = 1.5 + Math.random();}});for (let index = bullets.length - 1; index >= 0; index--) {const bullet = bullets[index];bullet.x += bullet.vx * deltaTime;bullet.y += bullet.vy * deltaTime;if (bullet.x < -bullet.radius || bullet.x > canvas.width + bullet.radius || bullet.y < -bullet.radius || bullet.y > canvas.height + bullet.radius || hitsWall(bullet.x, bullet.y, bullet.radius)) {bullets.splice(index, 1);continue;}if (bullet.owner === 'player') {const enemy = enemies.find(enemy => Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < bullet.radius + enemy.size);if (enemy) {enemy.hp--;bullets.splice(index, 1);if (enemy.hp <= 0) {enemies.splice(enemies.indexOf(enemy), 1);createExplosion(enemy.x, enemy.y);score += 10;}}} else if (Math.hypot(bullet.x - player.x, bullet.y - player.y) < bullet.radius + player.size) {player.hp -= 10;damageFlash = .2;bullets.splice(index, 1);if (player.hp <= 0) gameState = GAME_STATE.GAME_OVER;}}if (!enemies.length) {if (level < maps.length) loadLevel(level + 1);else gameState = GAME_STATE.WIN;}}function shoot() {if (gameState !== GAME_STATE.PLAYING || player.cooldown > 0) return;createBullet(player.x, player.y, player.angle, 'player');player.cooldown = .25;}function drawPlayer() {context.save();context.translate(player.x, player.y);context.rotate(player.angle);context.fillStyle = '#4caf50';context.fillRect(-player.size, -player.size * .7, player.size * 2, player.size * 1.4);context.fillStyle = '#8bc34a';context.fillRect(-10, -7, 30, 14);context.fillStyle = '#263238';context.fillRect(0, -4, 25, 8);context.restore();}function drawEnemies() {enemies.forEach(enemy => {context.save();context.translate(enemy.x, enemy.y);context.rotate(enemy.angle);context.fillStyle = '#d94f4f';context.fillRect(-enemy.size, -enemy.size * .7, enemy.size * 2, enemy.size * 1.4);context.fillStyle = '#ff7b54';context.fillRect(-9, -7, 28, 14);context.fillStyle = '#3b2020';context.fillRect(0, -4, 25, 8);context.restore();context.fillStyle = '#f5f5f5';context.font = '12px sans-serif';context.textAlign = 'center';context.fillText(`HP ${enemy.hp}`, enemy.x, enemy.y - enemy.size - 8);});}function drawBullets() {context.fillStyle = '#ffca28';bullets.forEach(bullet => {context.beginPath();context.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);context.fill();});}function drawEffects() {effects.forEach(effect => {context.globalAlpha = Math.min(1, effect.life * 8);context.fillStyle = effect.type === 'flash' ? '#fff59d' : '#ff7043';context.beginPath();context.arc(effect.x, effect.y, effect.type === 'flash' ? 10 : 5, 0, Math.PI * 2);context.fill();});context.globalAlpha = 1;}function drawWalls() {context.fillStyle = '#607d8b';for (let row = 0; row < map.length; row++) for (let column = 0; column < map[row].length; column++) {if (map[row][column] === '1') {const bounds = wallBounds(column, row);context.fillRect(bounds.x, bounds.y, bounds.width, bounds.height);}}}function drawStatus() {context.fillStyle = 'rgba(15, 23, 30, .86)';context.fillRect(12, 12, 180, 104);context.fillStyle = '#f5f5f5';context.font = 'bold 14px sans-serif';context.textAlign = 'left';context.fillText(`SCORE  ${score}`, 24, 34);context.fillText(`LEVEL  ${level}`, 24, 56);context.fillText(`WAVE   ${wave}`, 24, 78);context.fillText(`HP     ${Math.max(0, player.hp)}`, 24, 100);context.fillStyle = '#263238';context.fillRect(76, 90, 96, 10);context.fillStyle = player.hp > 30 ? '#66bb6a' : '#ef5350';context.fillRect(76, 90, 96 * Math.max(0, player.hp) / 100, 10);}function drawGameOver() {if (gameState !== GAME_STATE.GAME_OVER && gameState !== GAME_STATE.WIN) return;context.fillStyle = 'rgba(0, 0, 0, .7)';context.fillRect(0, 0, canvas.width, canvas.height);context.fillStyle = '#ffffff';context.textAlign = 'center';context.font = 'bold 36px sans-serif';context.fillText(gameState === GAME_STATE.WIN ? 'YOU WIN' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 20);restartButton.x = canvas.width / 2 - restartButton.width / 2;restartButton.y = canvas.height / 2 + 12;context.fillStyle = '#4caf50';context.fillRect(restartButton.x, restartButton.y, restartButton.width, restartButton.height);context.fillStyle = '#ffffff';context.font = 'bold 18px sans-serif';context.fillText(gameState === GAME_STATE.WIN ? 'PLAY AGAIN' : 'RESTART', canvas.width / 2, restartButton.y + 28);}function drawButton(label, y, color = '#4caf50') {const width = 210;const height = 44;const x = canvas.width / 2 - width / 2;context.fillStyle = color;context.fillRect(x, y, width, height);context.fillStyle = '#ffffff';context.font = 'bold 16px sans-serif';context.textAlign = 'center';context.fillText(label, canvas.width / 2, y + 28);return { x, y, width, height };}function drawMenu() {context.fillStyle = '#18212b';context.fillRect(0, 0, canvas.width, canvas.height);context.fillStyle = '#8bc34a';context.font = 'bold 42px sans-serif';context.textAlign = 'center';context.fillText('TANK BATTLE', canvas.width / 2, canvas.height / 2 - 130);menuButtons.play = drawButton('PLAY', canvas.height / 2 - 70);menuButtons.settings = drawButton('SETTINGS', canvas.height / 2 - 16, '#607d8b');menuButtons.help = drawButton('HOW TO PLAY', canvas.height / 2 + 38, '#607d8b');}function drawSettings() {context.fillStyle = '#18212b';context.fillRect(0, 0, canvas.width, canvas.height);context.fillStyle = '#ffffff';context.font = 'bold 30px sans-serif';context.textAlign = 'center';context.fillText('SETTINGS', canvas.width / 2, canvas.height / 2 - 120);context.font = '18px sans-serif';context.fillText(`DIFFICULTY: ${settings.difficulty}`, canvas.width / 2, canvas.height / 2 - 62);menuButtons.settings = drawButton('CHANGE DIFFICULTY', canvas.height / 2 - 38, '#607d8b');context.fillText(`SOUND: ${settings.sound ? 'ON' : 'OFF'}`, canvas.width / 2, canvas.height / 2 + 32);menuButtons.play = drawButton('TOGGLE SOUND', canvas.height / 2 + 54, '#607d8b');menuButtons.back = drawButton('BACK', canvas.height / 2 + 108, '#455a64');}function drawHelp() {context.fillStyle = '#18212b';context.fillRect(0, 0, canvas.width, canvas.height);context.fillStyle = '#ffffff';context.textAlign = 'center';context.font = 'bold 30px sans-serif';context.fillText('HOW TO PLAY', canvas.width / 2, canvas.height / 2 - 110);context.font = '17px sans-serif';context.fillText('WASD / ARROWS  MOVE AND TURN', canvas.width / 2, canvas.height / 2 - 48);context.fillText('MOUSE  AIM    CLICK  FIRE', canvas.width / 2, canvas.height / 2 - 14);context.fillText('DESTROY ENEMIES AND SURVIVE', canvas.width / 2, canvas.height / 2 + 20);menuButtons.back = drawButton('BACK', canvas.height / 2 + 64, '#455a64');}function render() {if (gameState === GAME_STATE.MENU) return drawMenu();if (gameState === GAME_STATE.SETTINGS) return drawSettings();if (gameState === GAME_STATE.HELP) return drawHelp();context.fillStyle = '#18212b';context.fillRect(0, 0, canvas.width, canvas.height);drawWalls();drawBullets();drawEnemies();drawPlayer();drawEffects();drawStatus();drawGameOver();if (damageFlash) {context.fillStyle = `rgba(239, 83, 80, ${damageFlash * 1.5})`;context.fillRect(0, 0, canvas.width, canvas.height);}}function gameLoop(time) {const deltaTime = Math.min((time - previousTime) / 1000, .05);previousTime = time;update(deltaTime);render();requestAnimationFrame(gameLoop);}window.addEventListener('keydown', event => {keys[event.key.length === 1 ? event.key.toLowerCase() : event.key] = true;if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();});window.addEventListener('keyup', event => {keys[event.key.length === 1 ? event.key.toLowerCase() : event.key] = false;});canvas.addEventListener('mousemove', event => {const bounds = canvas.getBoundingClientRect();player.angle = Math.atan2(event.clientY - bounds.top - player.y, event.clientX - bounds.left - player.x);});canvas.addEventListener('click', event => {const bounds = canvas.getBoundingClientRect();const x = event.clientX - bounds.left;const y = event.clientY - bounds.top;const inside = button => x >= button.x && x <= button.x + button.width && y >= button.y && y <= button.y + button.height;if (gameState === GAME_STATE.MENU) {if (inside(menuButtons.play)) startGame();else if (inside(menuButtons.settings)) gameState = GAME_STATE.SETTINGS;else if (inside(menuButtons.help)) gameState = GAME_STATE.HELP;} else if (gameState === GAME_STATE.SETTINGS) {if (inside(menuButtons.settings)) settings.difficulty = settings.difficulty === 'EASY' ? 'NORMAL' : settings.difficulty === 'NORMAL' ? 'HARD' : 'EASY';else if (inside(menuButtons.play)) settings.sound = !settings.sound;else if (inside(menuButtons.back)) gameState = GAME_STATE.MENU;} else if (gameState === GAME_STATE.HELP) {if (inside(menuButtons.back)) gameState = GAME_STATE.MENU;} else if (gameState === GAME_STATE.GAME_OVER || gameState === GAME_STATE.WIN) {if (inside(restartButton)) restartGame();} else shoot();});window.addEventListener('resize', resizeCanvas);resizeCanvas();requestAnimationFrame(gameLoop);</script></body></html>
